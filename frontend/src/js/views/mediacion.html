<h2>Mediación</h2>
<div class="oj-panel">
    <h4 class="oj-helper-text-align-center">Solicitudes</h4>
    <div>
        <oj-c-button label="Nueva" on-oj-action="[[btnNuevaSolicitud]]" size="lg" disabled="[[solicitudDetalle]]"><span
                slot="startIcon" class="oj-ux-ico-plus"></span></oj-c-button>
        <oj-c-input-text id="filtro" class="oj-form-control-max-width-md" label-hint="Filtro" label-edge="inside"
            placeholder="Buscar por Num. de Solicitud" clear-icon="always" on-raw-value-changed="[[handleValueChanged]]"
            value="{{filtro}}" disabled="[[solicitudDetalle]]"></oj-c-input-text>
    </div>
    <oj-table id="solicitudes" class="tabla" data='[[dataProvider]]' columns='[
        {"headerText":"Número", "field":"folio"},
        {"headerText":"Fecha de solicitud", "field":"fechaSolicitud", "template":"fechaTemplate", "id":"fechaSolicitud"},
        {"headerText":"Materia", "field":"materia.descripcion"},
        {"headerText":"Nombre u Razón Usuario", "field":"usuarioPersona.nombreCompleto"},
        {"headerText":"Estatus", "field":"estatus", "template":"estatusTemplate"},
        {"headerText":"Seguimiento", "field":"seguimiento"},
        {"headerText":"", "width":"150", "template":"botonesTemplate"}
    ]' selection-mode.row="single" first-selected-row="{{solicitudSeleccionada}}"
        on-first-selected-row-changed="[[firstSelectedRowChangedListener]]" scroll-policy="loadMoreOnScroll"
        scroll-policy-options.fetch-size="10">
        <template slot="estatusTemplate" data-oj-as="item">
            <oj-c-select-single id="estatusSolicitud" data="[[estadoSolicitudDP]]" item-text="label"
                value="{{item.data }}" label-hint="Estatus" readonly></oj-c-select-single>
        </template>
        <template slot="fechaTemplate" data-oj-as="item">
            <oj-bind-text value="[[dateConverter(item.data)]]"></oj-bind-text>
        </template>
        <template slot="botonesTemplate" data-oj-as="cell">
            <oj-c-button label="Editar" display="icons" chroming="borderless" size="sm"
                on-oj-action="[[btnEditarSolicitud]]"><span slot="startIcon"
                    class="oj-ux-ico-edit"></span></oj-c-button>
            <oj-c-button label="Imprimir" display="icons" chroming="borderless" size="sm"
                on-oj-action="[[btnOpen]]"><span slot="startIcon" class="oj-ux-ico-print"></span></oj-c-button>
            <oj-c-button label="Borrar" display="icons" chroming="borderless" size="sm"><span slot="startIcon"
                    class="oj-ux-ico-delete-all"></span></oj-c-button>
        </template>
    </oj-table>

    <oj-bind-if test="[[solicitudSeleccionada()]]">
        <div id="solicitud" class="oj-panel oj-sm-margin-2x-top">
            <h4 class="oj-typography-subheading-xs">Datos generales</h4>
            <oj-validation-group id="trackerSolicitud" valid="{{groupValid}}" role="group">
                <oj-c-form-layout max-columns="3" direction="row">
                    <oj-c-input-text id="solicitudId" value="{{solicitudId}}" label-hint="ID"
                        readonly></oj-c-input-text>
                    <oj-c-input-text id="solicitudFolio" value="{{solicitudFolio}}" label-hint="Folio"
                        readonly></oj-c-input-text>
                    <oj-input-date id="fechaSolicitud" value="{{solicitudFecha}}" label-hint="Fecha de Solicitud"
                        converter="[[dateConverterInput]]" min="[[minFecha]]" max="[[maxFecha]]"
                        readonly="[[solicitudId()]]" required></oj-input-date>
                    <oj-c-select-single id="selectMateria" data="[[materiasDP]]" item-text="descripcion"
                        value="{{solicitudMateriaId}}" on-oj-value-action="[[valueActionHandler]]" label-hint="Materia"
                        required="true" required-message-detail="Seleccione el Tipo de Materia"
                        help.instruction="Seleccione el Tipo de Materia">
                    </oj-c-select-single>
                    <oj-c-select-single id="selectTipoApertura" data="[[tipoAperturaDP]]" item-text="descripcion"
                        value="{{solicitudTipoAperturaId}}" on-oj-value-action="[[valueActionHandler]]"
                        label-hint="Apertura" required required-message-detail="Seleccione el Tipo de Apertura"
                        help.instruction="Seleccione el Tipo de Apertura">
                    </oj-c-select-single>
                    <oj-c-text-area id="descripcion" column-span="3" value="{{solicitudDescripcion}}"
                        label-hint="Descripción del Conflicto" rows="4" required
                        required-message-detail="Describa el conflicto"
                        help.instruction="Describa brevemente el conflicto" validators="[[requeridoValidator]]">
                    </oj-c-text-area>
                </oj-c-form-layout>

        </div>

        <div class="oj-panel oj-sm-margin-2x-vertical">
            <h4 class="oj-typography-subheading-xs">Datos del Usuario</h4>
            <oj-module id="usuario" config="[[moduleInfoPersona('Usuario')]]"></oj-module>

            <h4 class="oj-typography-subheading-xs">Datos del Invitado</h4>
            <oj-module id="invitado" config="[[moduleInfoPersona('Invitado')]]"></oj-module>
        </div>

        <oj-bind-if test="[[solicitudId()]]">
            <div class="oj-panel oj-sm-margin-2x-top" style="width: 1px; min-width: 100%;">
                <h4 class="oj-typography-subheading-xs">Seguimiento solicitud</h4>
                <oj-c-form-layout full-width="true">
                    <div class="oj-flex">
                        <div class="oj-flex-item oj-sm-4 oj-sm-padding-2x-end oj-md-padding-3x-end">
                            <oj-c-radioset id="esMediable" value="{{ solicitudMediable }}" direction="row"
                                label-hint="La solicitud es Mediable" options="[[esMediableDP]]">
                            </oj-c-radioset>
                        </div>
                        <div class="oj-flex-item oj-sm-4 oj-sm-padding-2x-end oj-md-padding-3x-end">
                            <oj-c-radioset id="protocoloViolencia" value="{{solicitudProtocoloViolencia}}"
                                direction="row" label-hint="Protocolo de Violencia" options="[[protocoloViolencia]]"
                                disabled="[[ solicitudMediable() == 0 ]]">
                            </oj-c-radioset>
                        </div>
                        <!-- <div class="oj-flex-item oj-sm-4 oj-sm-padding-2x-end oj-md-padding-3x-end">
                            <oj-c-select-single id="estatusSolicitud" data="[[estadoSolicitudDP]]" item-text="label"
                                value="{{solicitudEstatus}}"
                                disabled="{{ estatusSolicitudDisabled }}" 
                                label-hint="Seguimientosss"></oj-c-select-single>
                        </div> -->
                        <div class="oj-flex-item oj-sm-4 oj-sm-padding-2x-end oj-md-padding-3x-end">
                            <oj-c-select-single id="estatusSolicitud" data="[[estadoSolicitudDP]]" item-text="label"
                                value="{{solicitudEstatus}}"
                                label-hint="Seguimientosss"></oj-c-select-single>
                        </div>
                        <oj-bind-if test="[[ solicitudMediable() == 1 ]]">

                            <oj-c-button chroming="callToAction" label="Generar invitación"
                                on-oj-action="[[  generar_invitacion ]]" disabled="[[ invitacionActiva ]]"></oj-c-button>
                            <!--
                            mediador
                            <div class="oj-flex-item oj-sm-8 oj-sm-padding-2x-end oj-md-padding-3x-end">
                                <oj-c-select-single id="estatusSolicitud" data="[[mediadoresDP]]" item-text="label"
                                    value="{{solicitudEstatus}}" disabled="[[ solicitudMediable() == 2]]"
                                    label-hint="Mediador"></oj-c-select-single>
                            </div>
                            -->
                            <div
                                class="oj-flex-item oj-sm-12 oj-sm-padding-2x-end oj-md-padding-3x-end oj-md-margin-3x-top">
                                <h4 class="oj-typography-subheading-xs">Detalles de las invitaciones: </h4>
                                
                                <oj-table style="width:100%"  id="asistencias" class="" data='[[ asistenciasDP ]]' columns='[
                                {"headerText":"Número de invitación", "field":"tipo", "template": "numRowTemplate"},
                                {"headerText":"Fecha invitación", "field":"fechaAsistencia", "template": "fechaRowTemplate"},
                                {"headerText":"Asiste persona", "field":"acepta_usuario", "template": "textRowTemplate"},
                                {"headerText":"Asiste invitado", "field":"acepta_invitado", "template": "textRowTemplate"},
                                {"headerText":"Acciones", "width":"150", "template":"botonesTemplate"}
                            ]' selection-mode.row="single" scroll-policy="loadMoreOnScroll"
                                    scroll-policy-options.fetch-size="10">

                                    <template slot="numRowTemplate" data-oj-as="item">
                                        <oj-bind-text value="[[ item.data ]]"></oj-bind-text>
                                    </template>

                                    <template slot="fechaRowTemplate" data-oj-as="item">
                                        <oj-bind-text value="[[ item.data ]]"></oj-bind-text>
                                    </template>

                                    <template slot="textRowTemplate" data-oj-as="item">
                                        <oj-bind-text value="[[ item.data == true ? 'Si' : item.data == false ? 'No' : 'Sin registro' ]]" ></oj-bind-text>
                                    </template>

                                    <template slot="botonesTemplate" data-oj-as="cell">
                                        <oj-c-button label="Editar" display="icons" chroming="borderless" size="sm"
                                            on-oj-action="[[  btnOpenDetailAsistencia ]]"><span slot="startIcon"
                                                class="oj-ux-ico-add-edit-page"></span></oj-c-button>
                                       
                                    </template>
                                </oj-table>
                            </div>

                        </oj-bind-if>

                        <oj-bind-if test="[[ solicitudMediable() == 2 ]]">
                            <div class="oj-flex-item oj-sm-4 oj-sm-padding-2x-end oj-md-padding-3x-end">
                                <oj-switch id="enabledSwitchOn" value="{{solicitudCanalizada}}"
                                    label-hint="Canalizada "></oj-switch>
                            </div>
                            <div class="oj-flex-item oj-sm-8 oj-sm-padding-2x-end oj-md-padding-3x-end">
                                <oj-c-select-single id="estatusSolicitud" data="[[institucionesDP]]" item-text="label"
                                    value="{{ institucion_seleccionada }}" disabled="[[!solicitudCanalizada()]]"
                                    label-hint="Institucion"></oj-c-select-single>
                            </div>

                            <oj-c-text-area class="oj-sm-padding-2x-end oj-md-padding-3x-end"
                                label-hint="Describa el motivo por el cual se considera No Mediable"
                                value="{{ descripcionNoMediable  }}"></oj-c-text-area>
                        </oj-bind-if>

                        <div class="oj-flex-item oj-sm-4"></div>
                    </div>
                </oj-c-form-layout>
            </div>


            <!-- Mediadores-->
            <div class="oj-panel oj-sm-margin-2x-top">
                <h4 class="oj-typography-subheading-xs">Mediador</h4>
                
                <div class="oj-panel">
                    <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-sm-6">
                            <p><b>Seleccione el mediador a asignar.</b></p>                           
                        </div>    
                        <div class="oj-flex-item oj-sm-6">
                            <oj-c-select-single id="mediadorSelected" data="[[ mediadoresDP ]]" value="{{ mediadorSeleccionado }}" item-text="label" label-hint="Mediador"></oj-c-select-single>
                        </div>
                    </div>

                    <div class="oj-flex oj-sm-margin-2x-top">
                        <oj-c-button label="Asignar Mediador" on-oj-action="[[ generar_expediente ]]"></oj-c-button>                    
                    </div>                   
                </div>

                <!-- Funciones que captura el mediador -->

                <div class="oj-flex oj-sm-flex-items-initial oj-sm-align-items-center oj-md-margin-3x-top">
                    <div class="oj-flex-item oj-sm-4 oj-md-padding-3x-end">
                        <oj-c-select-single id="servicioSelected" data="[[ serviciosDP ]]" 
                            value="{{ servicioSeleccionado }}" item-text="label" 
                            label-hint="Servicios">
                        </oj-c-select-single>
                    </div>
                
                    <oj-bind-if test="[[servicioSeleccionado() == 1]]">
                        <div class="oj-flex-item oj-sm-4 oj-md-padding-3x-end">
                            <oj-c-select-single id="mediadorSelected" data="[[ psicologosDP ]]" 
                                value="{{ psicologoSeleccionado }}" item-text="label"  
                                label-hint="Psicólogos">
                            </oj-c-select-single>
                        </div>
                    </oj-bind-if>
                
                    <div class="oj-flex-item oj-sm-4">
                        <oj-c-button label="Guardar Información" on-oj-action="[[ aceptacionPsicologica ]]">
                        </oj-c-button>                    
                    </div>
                </div>

                <div class="oj-flex-item oj-sm-4 oj-md-margin-3x-top">
                    <oj-c-select-single id="servicioSelected" data="[[ acuerdoDP ]]" value="{{ acuerdoseleccionado }}" item-text="label" label-hint="¿Hay Acuerdo?"></oj-c-select-single>
                </div>

                <!-- <div class="oj-panel">
                    <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-sm-6">
                            <p><b>Convenio.</b></p>

                <div class="oj-panel">
                    <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-sm-6">
                            <p><b>Convenio.</b></p>
                        </div>
                
                        <div class="oj-flex oj-sm-flex-items-initial oj-md-margin-3x-top">
                            <div class="oj-flex-item oj-sm-4 oj-md-padding-10x-end">
                                <oj-c-input-text
                                    id="firstname"
                                    label-hint="Monto del convenio"
                                    value="{{convenio_monto}}"
                                    autocomplete="off">
                                </oj-c-input-text>
                            </div>
                
                            <div class="oj-flex-item oj-sm-4 oj-md-padding-10x-end">
                                <oj-c-select-single
                                    id="formaPago"
                                    data="[[ forma_pagoDP ]]"
                                    value="{{ convenio_forma_pago }}"
                                    item-text="label"
                                    label-hint="Forma de pago">
                                </oj-c-select-single>
                            </div>
                
                            <div class="oj-flex-item oj-sm-4 oj-md-padding-3x-end">
                                <oj-c-select-single
                                    id="garantia"
                                    data="[[ garantiaDP ]]"
                                    value="{{ convenio_garantia }}"
                                    item-text="label"
                                    label-hint="Garantía Inmobiliaria">
                                </oj-c-select-single>
                            </div>
                
                            <oj-bind-if test="[[ convenio_garantia() == 1 ]]">
                                <div class="oj-flex-item oj-sm-4 oj-md-padding-3x-end oj-md-margin-3x-top">
                                    <oj-c-input-text
                                        id="numOficio"
                                        label-hint="Número de oficio de retención de sueldos y salarios"
                                        value="{{convenio_num_oficio}}"
                                        autocomplete="off">
                                    </oj-c-input-text>
                                </div>
                            </oj-bind-if>
                
                            <div class="oj-flex-item oj-sm-4 oj-md-padding-10x-end oj-md-margin-3x-top">
                                <oj-c-select-single
                                    id="convenioTemporal"
                                    data="[[ garantiaDP ]]"
                                    value="{{ convenio_convenio_temporal }}"
                                    item-text="label"
                                    label-hint="¿Existe convenio temporal?">
                                </oj-c-select-single>
                            </div>
                        </div>
                
                        <!-- Nueva fila para el botón -->
                        <div class="oj-flex oj-sm-flex-items-initial oj-md-margin-3x-top oj-md-margin-3x-top">
                            <div class="oj-flex-item oj-sm-12 oj-text-align-center">
                                <oj-c-button
                                    label="Guardar Información"
                                    on-oj-action="[[ aceptacionPsicologica ]]">
                                </oj-c-button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Beneficiarios -->
                <div class="oj-panel">
                    <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-sm-6">
                            <p><b>Beneficiarios</b></p>
                        </div>
                
                        <div class="oj-flex oj-sm-flex-items-initial oj-md-margin-3x-top">
                            <div class="oj-flex-item oj-sm-4 oj-md-padding-10x-end">
                                <oj-c-input-text
                                    id="edad"
                                    label-hint="Edad"
                                    value="{{convenio_monto}}"
                                    autocomplete="off">
                                </oj-c-input-text>
                            </div>
                
                            <div class="oj-flex-item oj-sm-4 oj-md-padding-10x-end">
                                <oj-c-select-single
                                    id="sexo"
                                    data="[[ sexoDP ]]"
                                    value="{{ convenio_forma_pago }}"
                                    item-text="label"
                                    label-hint="sexo">
                                </oj-c-select-single>
                            </div>

                
                        <!-- Nueva fila para el botón -->
                        <div class="oj-flex oj-sm-flex-items-initial oj-md-margin-3x-top oj-md-margin-3x-top">
                            <div class="oj-flex-item oj-sm-12 oj-text-align-center">
                                <oj-c-button
                                    label="Guardar Información"
                                    on-oj-action="[[ aceptacionPsicologica ]]">
                                </oj-c-button>
                            </div>
                        </div>
                    </div>
                </div>
                 <!-- Fin beneficiario -->
                


                 
            </div>
            <!-- Fin mediadores --> 

            <!-- Psicologo -->
            <div class="oj-panel oj-sm-margin-2x-top">
                <h4 class="oj-typography-subheading-xs">Psicólogo</h4>
                
                <div class="oj-panel">
                    <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-sm-6">
                            <oj-c-select-single id="mediadorSelected" data="[[ continuarMediacion ]]" value="{{ continuarMedSeleccionado }}" item-text="label" label-hint="Se puede continuar con el proceso Mediación  "></oj-c-select-single>
                                                    
                        </div>
                        
                    </div>

                    <div class="oj-flex oj-sm-margin-2x-top">
                        <oj-c-button label="Guardar" on-oj-action="[[ guardarContinuarMed ]]"></oj-c-button>                    
                    </div>                   
                </div>
            </div>
            <!-- fin psicologo -->



            <div class="oj-panel oj-sm-margin-2x-top">
                <h4 class="oj-typography-subheading-xs">Documentos</h4>
                
                <div class="oj-panel">
                    <div class="oj-flex oj-sm-margin-2x-top">
                        <div class="oj-flex-item oj-sm-6">
                            <p><b>Seleccione el documento que desea agregar.</b></p>                           
                        </div>    
                        <div class="oj-flex-item oj-sm-6">
                            <oj-c-select-single id="formatosSelected" data="[[ formatosDP ]]" value="{{ formatoSeleccionado }}" item-text="label" label-hint="formatos disponibles"></oj-c-select-single>
                        </div>
                    </div>

                    <div class="oj-flex oj-sm-margin-2x-top">
                        <oj-c-button label="Agregar" on-oj-action="[[ agregar_formato ]]"></oj-c-button>
                    
                    </div>
                </div>
               
                

                <div class="oj-flex oj-sm-margin-2x-top">
                    <div class="oj-flex oj-sm-6">Formato</div>
                    <div class="oj-flex oj-sm-2">Fecha</div>
                </div>

                <oj-c-list-view aria-label="Basic list" data="[[documentosDP]]" id="listview">
                    <template slot="itemTemplate" data-oj-as="item">
                        <oj-c-list-item-layout>
                            <div class="oj-flex">
                                <div class="oj-flex-item oj-sm-6"><oj-bind-text
                                        value="[[item.data.nombre_documento]]"></oj-bind-text></div>
                                <div class="oj-flex-item oj-sm-2"><oj-bind-text
                                            value="[[ item.data.fecha_creacion ]]"></oj-bind-text></div>
                                <div class="oj-flex-item oj-sm-4">
                                    
                                    <oj-c-button id="btnImprimir" display="icons" size="sm" chroming="borderless"
                                        label="Imprimir documento" on-oj-action="[[btnOpen]]"
                                        disabled="[[item.data.printEnabled]]">
                                        <span slot="startIcon" class="oj-ux-ico-print"></span>
                                    </oj-c-button>

                                    <oj-c-button slot="end" display="icons" size="sm" chroming="borderless"
                                        label="Subir archivo"  on-oj-action="[[ btnUploadFile ]]" disabled="[[ !item.data.id_documento ]]"> 
                                        <span slot="startIcon" class="oj-ux-ico-upload"></span>
                                    </oj-c-button>

                                    <oj-c-button slot="end" display="icons" size="sm" chroming="borderless"
                                        label="Ver archivo" disabled="[[ !item.data.existeDocumento ]]" on-oj-action="[[ btnVerDocumento ]]">
                                        <span slot="startIcon" class="oj-ux-ico-view"></span>
                                    </oj-c-button>

                                    <oj-c-button slot="end" display="icons" size="sm" chroming="borderless"
                                        label="Eliminar archivo"  on-oj-action="[[ btnEliminarDocumento ]]">
                                        <span slot="startIcon" class="oj-ux-ico-delete-all"></span>
                                    </oj-c-button>
                                </div>
                            </div>
                        </oj-c-list-item-layout>
                    </template>
                </oj-c-list-view>
            </div>


            
        </oj-bind-if>

        

        <oj-toolbar chroming="outlined">
            <oj-c-button id="btnCancelar" label="Cancelar" on-oj-action="[[btnCancelarSolicitud]]"><span
                    slot="startIcon" class="oj-ux-ico-cancel"></span></oj-c-button>
            <oj-c-button id="btnGuardar" label="Guardar" on-oj-action="[[btnGuardarSolicitud]]"
                chroming="callToAction"><span slot="startIcon" class="oj-ux-ico-save"></span></oj-c-button>
            <!--<oj-c-button id="btnImprimir" label="Imprimir" on-oj-action="[[btnOpen]]" disabled="[[!solicitudId()]]"><span slot="startIcon" class="oj-ux-ico-print"></span></oj-c-button>-->
        </oj-toolbar>
    </oj-bind-if>

</div>


<!-- Modal para  la visualización de PDF -->
<oj-dialog id="modalPDF" dialog-title="Solicitud" aria-describedby="desc" style="width: 90vw; height: 90vh;"
    cancel-behavior="escape">
    <div slot="body">
        <oj-bind-if test="[[frameHabilitado]]">
            <embed id="pdfHolder" :src="[[dataPDF]]" style="height: 60vh; width: 99%;">
            </embed>
        </oj-bind-if>
        <a id="btnDescargarPdf" :href="[[dataPDF]]" class="oj-link-standalone" _target="blank"
            download="Solicitud.pdf">Descargar</a>
    </div>
    <div slot="footer">
        <oj-c-button id="okButton" on-oj-action="[[btnClose]]" label="OK"></oj-c-button>
    </div>
</oj-dialog>


<!-- Modal para la visualización de los detalles de la Persona Seleccionada -->
<oj-dialog id="modalPersona" dialog-title="Detalle de Persona" aria-describedby="desc"
    style="width: 90vw; height: 90vh;" cancel-behavior="escape">
    <div slot="body">
        <oj-module config="[[moduleDetallePersona]]"></oj-module>
    </div>
    <div slot="footer">
        <oj-c-button id="cancelButtonPersona" on-oj-action="[[btnClose]]" label="Cerrar"></oj-c-button>
    </div>
</oj-dialog>


<!-- Modal para la visualización de los detalles de la Asistencia Seleccionada -->
<oj-dialog id="modalAsistencia" dialog-title="Detalle de Invitación" aria-describedby="desc"
    style="width: 60vw; height: 50vh;" cancel-behavior="escape"   on-oj-before-close="[[handleDialogClose]]">
    <div slot="body">
        <oj-module
              config="[[moduleDetalleAsistencia]]"></oj-module>
    </div>
    <div slot="footer">
        <oj-c-button id="cancelButtonPersona" on-oj-action="[[btnClose]]" label="Cerrar"></oj-c-button>
    </div>
</oj-dialog>
